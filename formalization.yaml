# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Universal 81/29 Bound for Tuza's Triangle-Cover Conjecture"
  description: >-
    Unconditional Lean 4 + Mathlib formalization of the companion paper's proof that
    29 * tau(G) <= 81 * nu(G) (tau(G) <= (81 / 29) * nu(G) ~= 2.793103 * nu(G)) for
    every finite simple graph G, where nu(G) is the triangle packing number and tau(G)
    is the triangle transversal number; 81/29 is below Sichen Wang's 165/59 bound
    (arXiv:2609.13831). Main
    theorem: 1 of 1 in Lean (100%); companion 32-vertex gadget checked separately in
    exact rational Python. The Lean code extends Wang's MIT-licensed
    sichen-wang/tuza-lean library with the paper's helper-arborescence coupling,
    unmerged colored-family covers, and opposite-edge elimination, together with
    non-vacuity checks nu(K_4) = 1 and
    tau(K_4) = 2.
  authors:
    - "Tyler B. Hughes"
  license: "MIT"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C35", "05C70"]

sources:
  - title: "An 81/29 Upper Bound for Tuza's Conjecture via Helper Arborescences and Opposite-Edge Elimination"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/tuza-triangle-cover"
    type: paper
    location: "https://mathdiscoveries.org/results/tuza-triangle-cover"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorem 2 with its rational form and explicit
      transversal, and the K_4 values nu = 1 and tau = 2 of Section 1), and the
      Lean work formalizes them; the formalization presents no result that the
      paper does not. Its proof extends the 165/59 argument of Sichen Wang with
      helper-arborescence coupling, unmerged colored-family covers and
      opposite-edge elimination, and the Lean code extends Wang's MIT-licensed
      sichen-wang/tuza-lean (see the entry for Wang's paper). The strict bound
      of Corollary 3 and the 32-vertex gadget are not formalized here. AI
      research agents built and directed by Tyler B. Hughes generated and
      checked this work. No human mathematician has yet refereed the proof.
  - title: "A bound below 2.8 for Tuza's conjecture"
    authors:
      - "Sichen Wang"
    id: "https://arxiv.org/abs/2609.13831"
    type: paper
    location: "arXiv:2609.13831 (2026)"
    relationship: adapts
    note: >-
      Read (per the companion paper). Proves tau(G) <= (165 / 59) * nu(G) and releases the
      MIT-licensed Lean 4 formalization sichen-wang/tuza-lean. The bound
      formalized here changes and extends this result: the companion paper
      keeps Wang's four-cover architecture, book lemma and Lemma 2.3 covers
      and adds helper-arborescence coupling and opposite-edge elimination to
      reach 81/29, and the Lean code extends Wang's library, keeping its
      license.
  - title: "An improved upper bound for Tuza's conjecture via 2-colorable triangle families"
    authors:
      - "L. Yi"
    id: "https://arxiv.org/abs/2608.23010"
    type: paper
    location: "arXiv:2608.23010 (2026)"
    relationship: background
    note: >-
      Read (per the companion paper). Proves tau(G) <= (63 / 22) * nu(G) and identifies 54/19 as
      the barrier of Haxell's four-inequality system.
  - title: "Packing and covering triangles in graphs"
    authors:
      - "Penny E. Haxell"
    id: "https://doi.org/10.1016/S0012-365X(98)00183-6"
    type: paper
    location: "Discrete Mathematics 195 (1999), 251-254"
    relationship: background
    note: "Establishes the classical universal bound tau(G) <= (66 / 23) * nu(G). Publisher abstract and record checked; the full text is unread [to check]."
  - title: "A conjecture on triangles of graphs"
    authors:
      - "Zsolt Tuza"
    type: paper
    location: "Graphs and Combinatorics 6 (1990), 373-380"
    relationship: background
    note: "Poses Tuza's conjecture tau(G) <= 2 * nu(G)."

related_formalizations:
  - id: "https://github.com/sichen-wang/tuza-lean"
    relationship: builds-on
    note: "Upstream MIT-licensed Lean 4 formalization of tau(G) <= (165 / 59) * nu(G)."

status:
  scope: >-
    Unconditionally proved in Lean 4 + Mathlib with standard axioms only (zero
    sorry, zero native_decide): 29 * tau(G) <= 81 * nu(G), the rational form
    tau(G) <= (81 / 29) * nu(G), the explicit transversal witness
    exists_small_triangle_transversal_81_29, and non-vacuity on K_4
    (nu(K_4) = 1, tau(K_4) = 2), for every finite simple graph G. Companion
    finite-graph experiments and the 32-vertex gadget in the accompanying
    manuscript are verified separately in exact rational Python and are not
    required for the 81/29 theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: agent
      models: []
      framework: "AI research agent pipeline built and directed by Tyler B. Hughes"
      tool_setup: >-
        Autonomous builder, adversarial falsifier, and reviewer agents
        discovered the cover inequalities and formalized them in Lean 4 +
        Mathlib on top of Sichen Wang's MIT-licensed tuza-lean library.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Goal-directed mathematical discovery and Lean 4 formalization."
  spend_usd: "not tracked"
  notes: >-
    The cover inequalities and their Lean 4 formalization extending
    sichen-wang/tuza-lean were produced by AI research agents built and directed
    by Tyler B. Hughes. No human mathematician has yet refereed the proof.

fidelity:
  divergences: ""

review:
  status: agent-reviewed
  reviewers:
    - "Internal adversarial falsifier and reviewer agents"
  notes: >-
    Checked by separate internal falsifier and reviewer agents and audited for
    standard axioms only via TuzaBound/Verify.lean. Not yet refereed by a human
    mathematician.

alignment:
  namespace: "TuzaChallenge"
  statements:
    - source: "Universal 81/29 bound (natural-number form)"
      lean: "TuzaChallenge.tuza_bound_81_29_nat"
      module: "Challenge"
      status: proved
      note: "Unconditional 29 * tau(G) <= 81 * nu(G) for every finite simple graph G."
    - source: "Universal 81/29 bound (rational form)"
      lean: "TuzaChallenge.tuza_bound_81_29"
      module: "Challenge"
      status: proved
      note: "Unconditional tau(G) <= (81 / 29) * nu(G) over Q."
    - source: "Explicit edge-transversal witness"
      lean: "TuzaChallenge.exists_small_triangle_transversal_81_29"
      module: "Challenge"
      status: proved
      note: "Explicit edge subset C <= E(G) hitting every triangle with 29 * |C| <= 81 * nu(G)."
    - source: "Non-vacuity on K_4 (packing number)"
      lean: "TuzaChallenge.nu_complete4"
      module: "Challenge"
      status: proved
      note: "Verifies nu(K_4) = 1."
    - source: "Non-vacuity on K_4 (transversal number)"
      lean: "TuzaChallenge.tau_complete4"
      module: "Challenge"
      status: proved
      note: "Verifies tau(K_4) = 2."

acknowledgements: "Extends Sichen Wang's MIT-licensed sichen-wang/tuza-lean on Lean 4 and Mathlib."
